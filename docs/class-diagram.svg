<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="910" viewBox="0 0 1200 910"><rect width="1200" height="910" fill="#f7f7f0"/><g font-family="Arial, sans-serif" fill="#263126"><text x="45" y="51" font-size="29" font-weight="700">TechCart / Class Diagram</text><text x="45" y="81" font-size="13" font-weight="400">Jhames Emmanuel R. Holganza | React.js + Tailwind CSS | E-Commerce &amp; Retail</text><text x="45" y="116" font-size="13" font-weight="400">Six implemented JavaScript classes. Derived values use getters; relationships show runtime ownership.</text><rect x="45" y="160" width="310" height="344" rx="10" fill="white" stroke="#aab69c"/><path d="M46 161h308v41h-308Z" fill="#e1e8d6"/><text x="63" y="188" font-size="17" font-weight="700">Product</text><text x="60" y="228" font-size="12" font-weight="400">+ id, name, category: String</text><text x="60" y="251" font-size="12" font-weight="400">+ price, oldPrice, stock: Number</text><text x="60" y="274" font-size="12" font-weight="400">+ rating, reviews: Number</text><text x="60" y="297" font-size="12" font-weight="400">+ color, kind, tag: String</text><text x="60" y="320" font-size="12" font-weight="400">+ description: String</text><text x="60" y="343" font-size="12" font-weight="400">+ specs: String[]</text><path d="M45 367h310" stroke="#d3dcc9"/><text x="60" y="392" font-size="12" font-weight="400">+ discount: Number (getter)</text><rect x="445" y="180" width="310" height="175" rx="10" fill="white" stroke="#aab69c"/><path d="M446 181h308v41h-308Z" fill="#e1e8d6"/><text x="463" y="208" font-size="17" font-weight="700">CartItem</text><text x="460" y="248" font-size="12" font-weight="400">+ product: Product</text><text x="460" y="271" font-size="12" font-weight="400">+ quantity: Number</text><path d="M445 295h310" stroke="#d3dcc9"/><text x="460" y="320" font-size="12" font-weight="400">+ subtotal: Number (getter)</text><rect x="845" y="160" width="310" height="344" rx="10" fill="white" stroke="#aab69c"/><path d="M846 161h308v41h-308Z" fill="#e1e8d6"/><text x="863" y="188" font-size="17" font-weight="700">Cart</text><text x="860" y="228" font-size="12" font-weight="400">+ items: CartItem[]</text><path d="M845 252h310" stroke="#d3dcc9"/><text x="860" y="277" font-size="12" font-weight="400">+ count, subtotal: Number (getters)</text><text x="860" y="300" font-size="12" font-weight="400">+ shipping, total: Number (getters)</text><text x="860" y="323" font-size="12" font-weight="400">+ add(product, quantity): Cart</text><text x="860" y="346" font-size="12" font-weight="400">+ update(id, quantity): Cart</text><text x="860" y="369" font-size="12" font-weight="400">+ remove(id): Cart</text><text x="860" y="392" font-size="12" font-weight="400">+ toJSON(): Object[]</text><text x="860" y="415" font-size="12" font-weight="400">+ static restore(raw, products): Cart</text><rect x="445" y="495" width="310" height="270" rx="10" fill="white" stroke="#aab69c"/><path d="M446 496h308v41h-308Z" fill="#e1e8d6"/><text x="463" y="523" font-size="17" font-weight="700">Order</text><text x="460" y="563" font-size="12" font-weight="400">+ id, date, status: String</text><text x="460" y="586" font-size="12" font-weight="400">+ customer: Customer</text><text x="460" y="609" font-size="12" font-weight="400">+ items: CartItem[]</text><text x="460" y="632" font-size="12" font-weight="400">+ subtotal, shipping, total: Number</text><path d="M445 656h310" stroke="#d3dcc9"/><text x="460" y="681" font-size="12" font-weight="400">+ constructor(customer, cart)</text><rect x="845" y="580" width="310" height="185" rx="10" fill="white" stroke="#aab69c"/><path d="M846 581h308v41h-308Z" fill="#e1e8d6"/><text x="863" y="608" font-size="17" font-weight="700">Customer</text><text x="860" y="648" font-size="12" font-weight="400">+ name, email, phone: String</text><text x="860" y="671" font-size="12" font-weight="400">+ address, city, postal: String</text><path d="M845 695h310" stroke="#d3dcc9"/><text x="860" y="720" font-size="12" font-weight="400">+ constructor(details)</text><rect x="45" y="550" width="310" height="230" rx="10" fill="white" stroke="#aab69c"/><path d="M46 551h308v41h-308Z" fill="#e1e8d6"/><text x="63" y="578" font-size="17" font-weight="700">StoreContent</text><text x="60" y="618" font-size="12" font-weight="400">+ hero, shop, product, cart: Object</text><text x="60" y="641" font-size="12" font-weight="400">+ checkout, about, footer: Object</text><text x="60" y="664" font-size="12" font-weight="400">+ nav, sorts, perks: Object[]</text><text x="60" y="687" font-size="12" font-weight="400">+ categories: String[]</text><path d="M45 711h310" stroke="#d3dcc9"/><text x="60" y="736" font-size="12" font-weight="400">+ constructor(data)</text><path d="M845 242L755 242" fill="none" stroke="#5e7052" stroke-width="1.5"/><polygon points="845,242 837,237 829,242 837,247" fill="#5e7052"/><text x="760" y="225" font-size="10" font-weight="400">owns</text><text x="823" y="263" font-size="10" font-weight="400">1</text><text x="760" y="263" font-size="10" font-weight="400">0..*</text><path d="M445 280L355 280" fill="none" stroke="#5e7052" stroke-width="1.5"/><text x="360" y="263" font-size="10" font-weight="400">references</text><text x="423" y="301" font-size="10" font-weight="400">0..*</text><text x="360" y="301" font-size="10" font-weight="400">1</text><path d="M600 495L600 355" fill="none" stroke="#5e7052" stroke-width="1.5"/><polygon points="600,495 605,487 600,479 595,487" fill="#5e7052"/><text x="613" y="426" font-size="11" font-weight="400">snapshots</text><text x="613" y="484" font-size="11" font-weight="400">1</text><text x="613" y="374" font-size="11" font-weight="400">1..*</text><path d="M755 650L845 650" fill="none" stroke="#5e7052" stroke-width="1.5"/><text x="760" y="633" font-size="10" font-weight="400">placed by</text><text x="760" y="671" font-size="10" font-weight="400">0..*</text><text x="816" y="671" font-size="10" font-weight="400">1</text><text x="45" y="820" font-size="13" font-weight="700">Legend</text><text x="45" y="845" font-size="12" font-weight="400">Filled diamond = composition (owned items). Line = association (referenced object). + = public.</text><text x="45" y="870" font-size="12" font-weight="400">StoreContent supplies centralized page copy and UI configuration; full fields are in src/data.js.</text></g></svg>