<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1200" viewBox="0 0 1440 1200"><rect width="100%" height="100%" fill="#f7f7f0"/><g font-family="Arial, sans-serif"><rect x="0" y="0" width="1440" height="36" fill="#29362b" rx="0" stroke="none"/><text x="490" y="24" font-size="11" fill="white" font-weight="400">A little upgrade goes a long way.  Explore the collection ↗</text><text x="120" y="94" font-size="34" fill="#263126" font-weight="700">techcart.</text><text x="630" y="89" font-size="13" fill="#263126" font-weight="400">Home</text><text x="740" y="89" font-size="13" fill="#263126" font-weight="400">Shop all</text><text x="850" y="89" font-size="13" fill="#263126" font-weight="400">Our story</text><text x="1210" y="90" font-size="25" fill="#263126" font-weight="400">⌕</text><text x="1270" y="90" font-size="25" fill="#263126" font-weight="400">♧</text><path d="M0 120h1440" stroke="#d3d9cb"/><text x="120" y="188" font-size="11" fill="#68705e" font-weight="600">A LITTLE ABOUT US</text><text x="120" y="244" font-size="42" fill="#263126" font-weight="500">Good things, chosen thoughtfully.</text><text x="120" y="310" font-size="18" fill="#697660" font-weight="400">TechCart is a student-built concept store for everyday technology.</text><text x="120" y="345" font-size="18" fill="#697660" font-weight="400">We believe an upgrade should feel useful, simple, and a little exciting.</text><rect x="120" y="420" width="380" height="245" fill="#e7eadf" rx="20" stroke="none"/><text x="150" y="463" font-size="14" fill="#a8b39a" font-weight="400">01</text><text x="150" y="535" font-size="23" fill="#263126" font-weight="400">Useful by design</text><text x="150" y="575" font-size="13" fill="#68745f" font-weight="400">Every item has a place in your day. No</text><text x="150" y="600" font-size="13" fill="#68745f" font-weight="400">noise, just considered essentials.</text><rect x="530" y="420" width="380" height="245" fill="#e7eadf" rx="20" stroke="none"/><text x="560" y="463" font-size="14" fill="#a8b39a" font-weight="400">02</text><text x="560" y="535" font-size="23" fill="#263126" font-weight="400">Easy to explore</text><text x="560" y="575" font-size="13" fill="#68745f" font-weight="400">Clear categories, helpful details, and a</text><text x="560" y="600" font-size="13" fill="#68745f" font-weight="400">simple shopping experience.</text><rect x="940" y="420" width="380" height="245" fill="#e7eadf" rx="20" stroke="none"/><text x="970" y="463" font-size="14" fill="#a8b39a" font-weight="400">03</text><text x="970" y="535" font-size="23" fill="#263126" font-weight="400">Built to learn</text><text x="970" y="575" font-size="13" fill="#68745f" font-weight="400">React, Tailwind CSS, and object-oriented</text><text x="970" y="600" font-size="13" fill="#68745f" font-weight="400">models working together.</text><path d="M120 740h1200" stroke="#d3d9cb"/><text x="120" y="789" font-size="24" fill="#263126" font-weight="400">The project behind the store</text><text x="120" y="835" font-size="14" fill="#263126" font-weight="400">Created by Jhames Emmanuel R. Holganza · BSIT 3 · Cebu Institute of Technology</text><text x="120" y="880" font-size="13" fill="#697660" font-weight="400">All products, prices, ratings, and availability are fictional demo data.</text><text x="120" y="909" font-size="13" fill="#697660" font-weight="400">Product illustrations are original SVG assets. This site does not process real orders.</text><rect x="0" y="960" width="1440" height="220" fill="#e9ebdf" rx="0" stroke="none"/><text x="120" y="1020" font-size="30" fill="#263126" font-weight="700">techcart.</text><text x="120" y="1051" font-size="12" fill="#6c7661" font-weight="400">Good tech for your everyday.</text><text x="900" y="1028" font-size="11" fill="#263126" font-weight="400">Shop the collection</text><text x="1030" y="1028" font-size="11" fill="#263126" font-weight="400">Our story</text><text x="1160" y="1028" font-size="11" fill="#263126" font-weight="400">Your bag</text><path d="M120 1092h1200" stroke="#d3d9cb"/><text x="120" y="1124" font-size="10" fill="#7d8575" font-weight="400">© 2026 TechCart. A student concept store.</text><text x="1100" y="1124" font-size="10" fill="#7d8575" font-weight="400">Made for learning. Designed for everyday.</text></g></svg>